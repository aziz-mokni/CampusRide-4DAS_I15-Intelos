# Nom en majuscules dans Eureka -> la Gateway route vers lb://REPUTATION
spring.application.name=reputation
server.port=8084

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/reputation}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info

# Pages are returned as {content, page: {size, number, totalElements, totalPages}}
spring.data.web.pageable.serialization-mode=via-dto
spring.data.web.pageable.max-page-size=100

# Swagger UI: http://localhost:8084/swagger-ui.html  -  OpenAPI JSON: /v3/api-docs
springdoc.swagger-ui.operations-sorter=method
