server.port=8085
spring.application.name=NOTIFICATIONS

# ---- MongoDB (Spring Boot 4 : spring.mongodb.*) ----
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/notification_db}
spring.data.mongodb.auto-index-creation=true

# ---- RabbitMQ ----
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# un evenement qui echoue n'est pas remis en boucle
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.auto-startup=${RABBIT_LISTENER_ENABLED:true}

# ---- Eureka (mettre EUREKA_ENABLED=false pour travailler sans serveur Eureka) ----
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# ---- Securite : Keycloak (validation des JWT) ----
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:8180/realms/covoiturage/protocol/openid-connect/certs}
# jeton "service" (client credentials) utilise pour appeler le service Utilisateurs
keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/covoiturage/protocol/openid-connect/token}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:notification-service}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:change-me}

# ---- OpenFeign : si USERS_URL est vide, l'appel passe par Eureka (lb://USERS) ----
clients.users.url=${USERS_URL:}
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

# ---- E-mail : false = l'envoi est simule dans les logs ----
notification.mail.enabled=${MAIL_ENABLED:false}
notification.mail.from=no-reply@campusride.tn
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

# ---- Actuator (atelier Observabilite) ----
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# Transmettre a Eureka le vrai statut de /health (DOWN si Mongo ou RabbitMQ tombe)
eureka.client.healthcheck.enabled=true
management.info.env.enabled=true
info.app.name=notification-service
info.app.version=1.0.0
info.app.description=Microservice de notifications et messagerie
info.app.team=Les Intelos
management.health.mail.enabled=false
# false si RabbitMQ n'est pas lance (sinon le service apparait DOWN dans Eureka)
management.health.rabbit.enabled=${RABBIT_HEALTH_ENABLED:true}
spring.mvc.problemdetails.enabled=true
