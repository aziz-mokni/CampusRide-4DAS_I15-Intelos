server.port=8085

spring.application.name=NOTIFICATIONS

spring.data.mongodb.uri=mongodb://localhost:27017/notification_db


spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.mail.host=localhost
spring.mail.port=1025

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/covoiturage/protocol/openid-connect/certs

eureka.client.enabled=false
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

management.endpoints.web.exposure.include=health,info