services:
  mongo:
    image: mongo:7
    container_name: notif-mongo
    ports:
      - "27017:27017"
  rabbitmq:
    image: rabbitmq:3-management
    container_name: notif-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
  mailpit:
    image: axllent/mailpit
    container_name: notif-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"