spring.application.name=USERS
server.port=8081

# --- PostgreSQL (base propre au service) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/campusride_users
spring.datasource.username=postgres
spring.datasource.password=CHANGE_ME
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- RabbitMQ (exchange covoiturage.events) ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# --- Keycloak : validation des JWT (realm covoiturage, port 8180) ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/covoiturage

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
management.health.rabbit.enabled=false
spring.rabbitmq.listener.simple.default-requeue-rejected=false