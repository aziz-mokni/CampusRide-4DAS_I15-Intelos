spring.application.name=gateway
server.port=8080

# ---- Eureka (meme logique que le cours) ----
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.client.healthcheck.enabled=true

# ---- Securite Keycloak : validation des JWT a l'entree ----
gateway.security.enabled=${GATEWAY_SECURITY_ENABLED:true}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:8180/realms/covoiturage/protocol/openid-connect/certs}

# =====================================================================
# ROUTES - configuration DYNAMIQUE (lb:// = resolution par Eureka)
# Spring Cloud Gateway 5 (Boot 4) : prefixe spring.cloud.gateway.server.webflux.*
# (l'ancien prefixe du cours spring.cloud.gateway.routes[...] ne fonctionne plus)
# Predicate Path + URI lb://NOM_DU_SERVICE_DANS_EUREKA. Le 1er predicat qui correspond gagne.
# =====================================================================
# 0 - Reputation (avant Utilisateurs : /users/{id}/reviews, /score et /sanctions lui appartiennent)
spring.cloud.gateway.server.webflux.routes[0].id=reputation
spring.cloud.gateway.server.webflux.routes[0].uri=lb://REPUTATION
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/reviews/**,/api/v1/reports/**,/api/v1/sanctions/**,/api/v1/users/*/reviews,/api/v1/users/*/score,/api/v1/users/*/sanctions

# 1 - Utilisateurs
spring.cloud.gateway.server.webflux.routes[1].id=users
spring.cloud.gateway.server.webflux.routes[1].uri=lb://USERS
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/users/**

# 2 - Trajets
spring.cloud.gateway.server.webflux.routes[2].id=trips
spring.cloud.gateway.server.webflux.routes[2].uri=lb://TRIPS
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/trips/**

# 3 - Reservations et paiements
spring.cloud.gateway.server.webflux.routes[3].id=bookings
spring.cloud.gateway.server.webflux.routes[3].uri=lb://BOOKINGS
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/bookings/**

# 4 - Notifications et messagerie (avec coupe-circuit : bonus du cours)
spring.cloud.gateway.server.webflux.routes[4].id=notifications
spring.cloud.gateway.server.webflux.routes[4].uri=lb://NOTIFICATIONS
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/notifications/**,/api/v1/conversations/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=CircuitBreaker=name=notificationsCB,fallbackUri=forward:/fallback/notifications

# 5 - Documentation OpenAPI de chaque service, exposee par la Gateway (portail Swagger unifie)
spring.cloud.gateway.server.webflux.routes[5].id=docs-notifications
spring.cloud.gateway.server.webflux.routes[5].uri=lb://NOTIFICATIONS
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/docs/notifications/v3/api-docs
spring.cloud.gateway.server.webflux.routes[5].filters[0]=SetPath=/v3/api-docs

# Decommentez au fur et a mesure que les autres services publient leur doc (springdoc) :
#spring.cloud.gateway.server.webflux.routes[7].id=docs-users
#spring.cloud.gateway.server.webflux.routes[7].uri=lb://USERS
#spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/docs/users/v3/api-docs
#spring.cloud.gateway.server.webflux.routes[7].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webflux.routes[6].id=docs-reputation
spring.cloud.gateway.server.webflux.routes[6].uri=lb://REPUTATION
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/docs/reputation/v3/api-docs
spring.cloud.gateway.server.webflux.routes[6].filters[0]=SetPath=/v3/api-docs

# ---- Configuration STATIQUE (Partie 2 du cours : sans Eureka, URL en dur) - exemple ----
#spring.cloud.gateway.server.webflux.routes[9].id=notifications-static
#spring.cloud.gateway.server.webflux.routes[9].uri=http://localhost:8085
#spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/static/notifications/**

# ---- Portail Swagger unifie : http://localhost:8080/swagger-ui.html ----
springdoc.swagger-ui.urls[0].name=Notifications
springdoc.swagger-ui.urls[0].url=/docs/notifications/v3/api-docs
#springdoc.swagger-ui.urls[2].name=Utilisateurs
#springdoc.swagger-ui.urls[2].url=/docs/users/v3/api-docs
springdoc.swagger-ui.urls[1].name=Reputation
springdoc.swagger-ui.urls[1].url=/docs/reputation/v3/api-docs

# ---- Visualiser le routage et le load balancing (question 2.b du cours) ----
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG

# ---- Actuator (/actuator/gateway/routes liste les routes) ----
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=gateway
info.app.version=1.0.0
info.app.description=API Gateway CampusRide
