spring.application.name=eureka
server.port=8761

# Le serveur ne s'enregistre pas lui-meme et ne garde pas de copie du registre
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Developpement : retire rapidement du registre une instance arretee
# (evite le message "EMERGENCY! EUREKA MAY BE INCORRECTLY CLAIMING INSTANCES ARE UP")
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000

management.endpoints.web.exposure.include=health,info
